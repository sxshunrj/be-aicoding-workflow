schema_version: 2
repository: language-neutral-example
services: [example]
wiki_path: ../../wiki
commands:
  build: [bash, verify.sh, build]
  unit_test: [bash, verify.sh, unit-test]
disabled_nodes: [verify.integration_test]
max_attempts: 3
review_mode: human
knowledge:
  max_entries: 8
  max_characters: 12000
protected_paths: [.git/**, .ai-workflow/**]
